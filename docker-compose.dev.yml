# Frontend development with a remotely built backend workspace image.
#
# Usage:
#   1. docker compose -f docker-compose.dev.yml pull new-api
#   2. docker compose -f docker-compose.dev.yml up -d
#   3. make dev-web
#   4. Open http://localhost:5173 (API requests proxy to :3000)

services:
  new-api:
    image: ghcr.io/cnmbdb/new-api:dev
    pull_policy: always
    container_name: new-api-dev
    restart: unless-stopped
    working_dir: /workspace
    ports:
      - "${DEV_API_PORT:-3000}:3000"
    volumes:
      - .:/workspace
      - dev_web_dist:/workspace/web/dist
      - dev_data:/data
    environment:
      - SQL_DSN=postgresql://root:123456@postgres:5432/new-api
      - REDIS_CONN_STRING=redis://redis
      - TZ=Asia/Shanghai
      - BATCH_UPDATE_ENABLED=true
      - SESSION_COOKIE_SECURE=false
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - dev-network

  redis:
    image: redis:7-alpine
    container_name: new-api-dev-redis
    restart: unless-stopped
    networks:
      - dev-network

  postgres:
    image: postgres:15-alpine
    container_name: new-api-dev-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: new-api
    volumes:
      - dev_pg_data:/var/lib/postgresql/data
    networks:
      - dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d new-api"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  dev_web_dist:
  dev_data:
  dev_pg_data:

networks:
  dev-network:
    driver: bridge
