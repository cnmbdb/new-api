# Remote-image development stack. No local Docker image build is performed.
#
# First use or dependency refresh:
#   docker compose -f docker-compose.dev.yml pull
#
# Start API + web development:
#   docker compose -f docker-compose.dev.yml up
#   open http://localhost:5173
#
# SQLite is persisted in dev_data. Redis and external databases are disabled.

name: new-api-dev

x-dev-image: &dev-image ${DEV_IMAGE:-ghcr.io/cnmbdb/new-api:dev}

services:
  new-api:
    image: *dev-image
    pull_policy: always
    container_name: new-api-dev
    init: true
    working_dir: /workspace
    command: ["/usr/local/bin/new-api-dev-api"]
    ports:
      - "${DEV_API_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: .
        target: /workspace
      - dev_data:/data
    environment:
      SQLITE_PATH: /data/one-api.db
      MEMORY_CACHE_ENABLED: "false"
      SESSION_SECRET: ${DEV_SESSION_SECRET:-new-api-local-dev-session-secret-change-me}
      SESSION_COOKIE_SECURE: "false"
      TZ: ${TZ:-Asia/Shanghai}
      DEBUG: "true"
      NODE_NAME: new-api-dev
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -q '\"success\"[[:space:]]*:[[:space:]]*true'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    stop_grace_period: 10s
    networks:
      - dev-network

  web:
    image: *dev-image
    pull_policy: always
    container_name: new-api-dev-web
    init: true
    working_dir: /workspace/web
    command: ["/usr/local/bin/new-api-dev-web"]
    ports:
      - "${DEV_WEB_PORT:-5173}:5173"
    volumes:
      - type: bind
        source: .
        target: /workspace
      - dev_web_modules:/workspace/web/node_modules
    environment:
      VITE_REACT_APP_SERVER_URL: http://new-api:3000
    depends_on:
      new-api:
        condition: service_healthy
    networks:
      - dev-network

volumes:
  dev_data:
  dev_web_modules:

networks:
  dev-network:
    driver: bridge
